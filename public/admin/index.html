<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Admin | Abhyudaya Events</title>
  <link rel="icon" href="/assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/theme.js"></script>
</head>
<body>
  <!-- Login -->
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <img src="/assets/logo.png" alt="Abhyudaya Events">
      <h1>Admin Console</h1>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <div class="side-brand"><img src="/assets/logo-mark.png" alt=""><span>Abhyudaya<small>Admin</small></span></div>
      <nav id="menu"></nav>
      <div class="side-foot">
        <a href="/" target="_blank" class="link">↗ View website</a>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="top-actions">
          <span class="dirty" id="dirty" hidden>Unsaved changes</span>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch light / dark theme"></button>
          <button class="btn" id="saveBtn">Save &amp; Publish</button>
        </div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/config.js"></script>
  <script src="/admin/vendor/supabase.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
